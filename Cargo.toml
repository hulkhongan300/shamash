[package]
name = "shamash"
version = "0.1.0"
edition = "2024"
description = "A wake-word Discord music bot: listen for speech and play songs."
license = "MIT"
repository = "https://github.com/hulkhongan300/shamash"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
# Already in the graph via serenity/hyper, so adding it as a direct dependency
# costs no new downloads. Used for `join_all` over the catalog fan-out.
futures = "0.3.34"
# Object-safe async for the swappable catalog provider trait. Already in the
# dependency graph via serenity, so this adds no new transitive downloads.
async-trait = "0.1.92"
dotenvy = "0.15.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Jaro-Winkler for fuzzy-matching misheard song and artist names. Also already
# in the graph via darling; direct use costs nothing extra.
strsim = "0.9.3"
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache", "builder"] }
songbird = { version = "0.6.0", features = ["receive"] }
# Songbird depends on symphonia with `default-features = false` and exposes no
# feature to turn format handlers back on, so its probe registry is empty and
# every input fails with "no suitable format reader found". Depending on
# symphonia directly enables the handlers; Cargo unifies the features into the
# copy songbird links against.
# `wav`+`pcm` decode the acknowledgement tone, `mkv`+`vorbis` decode the
# WebM/Opus audio YouTube serves, and the rest cover the other formats a search
# result can come back as.
symphonia = { version = "0.5.5", default-features = false, features = [
    "aac",
    "flac",
    "isomp4",
    "mkv",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
tokio = { version = "1.53.1", features = ["full"] }
# transcribe.cpp, the same engine the Handy app wraps, linked directly instead
# of through `handy --transcribe-file`. Spawning that binary cost ~180 ms of app
# startup and a full model load on *every* utterance; holding the model in
# process makes a command cost only inference. The crate vendors and builds the
# C++ tree, so there is no dependency on the Handy install at runtime.
# `vulkan` puts inference on the GPU (an RX 570 here) instead of the CPU,
# where a Whisper decode costs ~17 s. Building it needs the Vulkan SDK headers
# and `glslc` for the compute shaders; drop the feature to fall back to CPU.
transcribe-cpp = { version = "0.2.4", features = ["vulkan"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
rphonetic = "3"
# transcribe.cpp is the speech engine. It replaced whisper-rs, which cannot
# coexist with it: both vendor their own copy of ggml and export the same C
# symbols, so a binary linking both dies with duplicate-symbol errors. Whisper
# models still work, as GGUFs, through this engine.

[dev-dependencies]
# `test-util` gives `#[tokio::test(start_paused = true)]`, which auto-advances
# the clock when the runtime is idle. The catalog timeout test needs to wait out
# a two-second budget, and this makes that instant rather than a two-second tax
# on every `cargo test`. A feature on a dependency already in the graph, not a
# new one.
tokio = { version = "1.53.1", features = ["full", "test-util"] }

