name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Installed from GitHub's cache rather than Ubuntu's mirrors: faster, and
      # a mirror outage no longer fails the build (it did, twice, on
      # 2026-11-11). `transcribe-cpp` is built with its `vulkan` feature, and
      # ggml's Vulkan backend compiles compute shaders at build time, so it
      # needs the Vulkan headers, `glslc` and the SPIR-V headers. Bump
      # `version` to refresh the cached packages. The runtime libraries are
      # listed too: the cache does not follow dependencies, and without them the
      # link fails with "unable to find library -lopus".
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: pkg-config libopus0 libopus-dev libvulkan1 libvulkan-dev glslc spirv-headers
          version: 2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets