name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # The same Debian and Rust as the Docker image's build stage. Packages come
    # from Debian's mirrors, not Ubuntu's: on 2026-11-11 the runners could not
    # reach security.ubuntu.com for hours and every run failed installing them.
    container: rust:1.98-trixie
    steps:
      - uses: actions/checkout@v4
      # `transcribe-cpp` is built with its `vulkan` feature, and ggml's Vulkan
      # backend compiles compute shaders at build time: it needs cmake, the
      # Vulkan headers, `glslc` and the SPIR-V headers. libopus is songbird's.
      - name: Install system dependencies
        run: |
          apt-get -o Acquire::Retries=5 update
          apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            cmake pkg-config libopus-dev libvulkan-dev glslc spirv-headers
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
